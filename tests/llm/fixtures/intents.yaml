# ---- ambiguous: a clarification is required ----
- id: amb-01
  kind: ambiguous
  clarify: true
  fallback: true
  turns: ["I need FX market data and API calls for my research today, budget 5 USDC"]
  answers: {payee: "Use all five: Atlas Data, Slowpoke Analytics, Nova Labs, Orion API and Ghost Feeds"}
  expect: {payees: [atlas, slowpoke, nova, orion, ghost], per_tx: "1.00", total: "5.00", valid_hours: 24}

- id: amb-02
  kind: ambiguous
  clarify: true
  fallback: true
  turns: ["Buy some FX data for me, budget 2 USDC"]
  answers: {payee: "Atlas Data only"}
  expect: {payees: [atlas], per_tx: "1.00", total: "2.00", valid_hours: 24}

- id: amb-03
  kind: ambiguous
  clarify: true
  turns: ["Buy data for my research today"]
  answers: {payee: "Atlas Data", budget: "2 USDC in total", any: "Atlas Data, 2 USDC in total"}
  expect: {payees: [atlas], per_tx: "1.00", total: "2.00", valid_hours: 24}

- id: amb-04
  kind: ambiguous
  clarify: true
  fallback: true
  turns: ["Get me FX data from Atlas, I have not decided the budget yet"]
  answers: {budget: "1.50 USDC total", any: "1.50 USDC total"}
  expect: {payees: [atlas], per_tx: "1.00", total: "1.50", valid_hours: 24}

- id: amb-05
  kind: ambiguous
  clarify: true
  fallback: true
  turns: ["Set up a mandate for currency rates, 3 USDC"]
  answers: {payee: "Slowpoke Analytics and Atlas Data"}
  expect: {payees: [slowpoke, atlas], per_tx: "1.00", total: "3.00", valid_hours: 24}

- id: amb-06
  kind: ambiguous
  clarify: true
  turns: ["I want to buy from the weather data provider, budget 1 USDC"]
  answers: {payee: "Sorry, I meant Nova Labs", any: "Nova Labs"}
  expect: {payees: [nova], per_tx: "1.00", total: "1.00", valid_hours: 24}

# ---- corrections: the second message corrects the draft ----
- id: cor-01
  kind: correction
  fallback: true
  turns: ["Buy FX data from Atlas Data, budget 5 USDC", "Actually make the total 4 USDC, not 5"]
  expect: {payees: [atlas], per_tx: "1.00", total: "4.00", valid_hours: 24}

- id: cor-02
  kind: correction
  fallback: true
  turns: ["Buy API calls from Orion API, total 2 USDC", "Change the per transaction limit to 0.50 USDC"]
  expect: {payees: [orion], per_tx: "0.50", total: "2.00", valid_hours: 24}

- id: cor-03
  kind: correction
  fallback: true
  turns: ["Buy historical FX data from Slowpoke Analytics, total 1 USDC, for 24 hours", "Make it valid for 48 hours instead"]
  expect: {payees: [slowpoke], per_tx: "1.00", total: "1.00", valid_hours: 48}

- id: cor-04
  kind: correction
  fallback: true
  turns: ["Buy from Atlas Data and Ghost Feeds, total 3 USDC", "Remove Ghost Feeds, only Atlas Data"]
  expect: {payees: [atlas], per_tx: "1.00", total: "3.00", valid_hours: 24}

- id: cor-05
  kind: correction
  fallback: true
  turns: ["Buy sample data from Nova Labs, budget 1 USDC", "Sorry, make the total 0.80 USDC"]
  expect: {payees: [nova], per_tx: "0.80", total: "0.80", valid_hours: 24}

- id: cor-06
  kind: correction
  turns: ["Buy FX data from Atlas Data, 2 USDC total", "Add Orion API to the payees as well"]
  expect: {payees: [atlas, orion], per_tx: "1.00", total: "2.00", valid_hours: 24}

