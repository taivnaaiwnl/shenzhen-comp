<text x="930" y="615" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L8</text>
<text x="958" y="615" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#1F2933" text-anchor="start">Owner console</text>
<text x="916" y="642" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="start">Confirmations rebuilt from the</text>
<text x="916" y="658" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="start">chain; textContent and strict CSP</text>
