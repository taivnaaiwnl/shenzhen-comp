<rect x="900" y="468" width="300" height="96" rx="8" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="930" cy="498" r="18" fill="#2F6DB5"/>
