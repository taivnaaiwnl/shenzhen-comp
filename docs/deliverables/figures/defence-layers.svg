<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C59"/></marker></defs><rect width="1240" height="900" fill="#FFFFFF"/><rect x="170" y="20" width="500" height="46" rx="8" fill="#FFFFFF" stroke="#C2621C" stroke-width="1.5"/>
<text x="420.0" y="49" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Counterparty invoice, message or delivery payload (untrusted)</text>
<path d="M420.0,66 L420.0,100" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="100" width="760" height="92" rx="8" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.5"/>
<circle cx="74" cy="146.0" r="21" fill="#2F6DB5"/>
<text x="74" y="151.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L1</text>
<text x="110" y="130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933" text-anchor="start">Invoice validation V01-V09 and injection detector</text>
<text x="786" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#52606D" text-anchor="end" font-style="italic">off-chain code (P2)</text>
<text x="110" y="156" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#52606D" text-anchor="start">Unsolicited, malformed, off-catalogue or badly signed invoices are dropped before any LLM turn</text>
<path d="M420.0,192 L420.0,226" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="226" width="760" height="92" rx="8" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.5"/>
<circle cx="74" cy="272.0" r="21" fill="#2F6DB5"/>
<text x="74" y="277.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L2</text>
<text x="110" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933" text-anchor="start">Quarantine and turn-type tool sets</text>
<text x="786" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#52606D" text-anchor="end" font-style="italic">off-chain code (P2)</text>
<text x="110" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#52606D" text-anchor="start">Memo masked and wrapped as DATA; counterparty messages never reach the LLM</text>
<path d="M420.0,318 L420.0,352" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="352" width="760" height="92" rx="8" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.5"/>
<circle cx="74" cy="398.0" r="21" fill="#2F6DB5"/>
<text x="74" y="403.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L3</text>
<text x="110" y="382" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933" text-anchor="start">Action-Selector with echo-and-verify</text>
<text x="786" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#52606D" text-anchor="end" font-style="italic">off-chain code (P2)</text>
<text x="110" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#52606D" text-anchor="start">One tool from a closed set; payee and amount must match the signed invoice</text>
<path d="M420.0,444 L420.0,478" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="478" width="760" height="92" rx="8" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.5"/>
<circle cx="74" cy="524.0" r="21" fill="#2F6DB5"/>
<text x="74" y="529.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L4</text>
<text x="110" y="508" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933" text-anchor="start">Policy engine</text>
<text x="786" y="508" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#52606D" text-anchor="end" font-style="italic">pass 1 in P2, pass 2 in P3</text>
<text x="110" y="534" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#52606D" text-anchor="start">Deterministic gates, decision table, exposure and velocity limits; never less strict than the LLM</text>
<path d="M420.0,570 L420.0,604" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="604" width="760" height="92" rx="8" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.5"/>
<circle cx="74" cy="650.0" r="21" fill="#2F6DB5"/>
<text x="74" y="655.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L5</text>
<text x="110" y="634" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933" text-anchor="start">Signer process</text>
<text x="786" y="634" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#52606D" text-anchor="end" font-style="italic">separate OS process (P3)</text>
<text x="110" y="660" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#52606D" text-anchor="start">The only wallet key; re-validation on fresh state, violation classification, function whitelist</text>
<path d="M420.0,696 L420.0,730" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="730" width="760" height="92" rx="8" fill="#F1F8F1" stroke="#2E7D32" stroke-width="2"/>
<circle cx="74" cy="776.0" r="21" fill="#2E7D32"/>
<text x="74" y="781.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L6</text>
<text x="110" y="760" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933" text-anchor="start">TierVault on-chain</text>
<text x="786" y="760" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#52606D" text-anchor="end" font-style="italic">contract (Base Sepolia)</text>
<text x="110" y="786" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#52606D" text-anchor="start">Mandates, pinned payout wallets, tier caps, grade masks, reserve floor, replay protection, freeze</text>
<path d="M420.0,822 L420.0,856" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="270" y="856" width="300" height="40" rx="8" fill="#F1F8F1" stroke="#2E7D32" stroke-width="1.5"/>
<text x="420.0" y="882" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Funds move on Base Sepolia</text>
<rect x="880" y="246" width="320" height="92" rx="8" fill="#F4F5F7" stroke="#7B8794" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="894" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="start">LLM (may be fully hijacked)</text>
<text x="894" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="start">Sees only L2 output; proposes one tool</text>
<text x="894" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="start">call. It is not a security boundary.</text>
