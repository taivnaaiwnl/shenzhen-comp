<text x="958" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#1F2933" text-anchor="start">Bureau rules</text>
<text x="916" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="start">Standing weights, verified reports,</text>
