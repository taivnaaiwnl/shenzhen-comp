<circle cx="930" cy="722" r="18" fill="#2F6DB5"/>
<text x="930" y="727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L9</text>
<text x="958" y="727" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#1F2933" text-anchor="start">Autonomy operator</text>
<text x="916" y="754" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="start">Freezes on any outflow without</text>
